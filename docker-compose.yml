# Déploiement d'essai (backend + PostgreSQL). Le frontend se construit avec « npm run build » et se sert derrière un proxy HTTPS (voir README).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: agriconnect, POSTGRES_PASSWORD: "${DB_PASSWORD:?Définissez DB_PASSWORD}", POSTGRES_DB: agriconnect }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg://agriconnect:${DB_PASSWORD}@db:5432/agriconnect
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agriconnect.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENT_MODE: ${PAYMENT_MODE:-demo}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
volumes: { pgdata: {}, uploads: {} }
